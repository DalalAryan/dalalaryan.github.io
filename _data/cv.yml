    Experience:
      - company: NASA
        position: Machine Learning Engineering Intern
        location: Cleveland, OH
        start_date: 2026-06
        end_date: 2026-09
        highlights:
          - Built an attention-based graph neural network (GNN) in PyTorch to predict 4-port impedance spectra (501 frequency points) of randomized circuit topologies as a fast surrogate for SPICE simulation.
          - Achieved common-mode R² of 0.986 and differential-mode R² of 0.978 across 100,000 simulated netlists by iterating on model architecture, normalization, and regularization using Optuna and MLflow.
          - Performed readout ablations (node-level, mean, and attention pooling) and binned error diagnostics to isolate why differential-mode targets underperformed.
          - Led a data-scaling study from 1K to 95K training examples using cluster-stratified sampling and a fixed held-out test set using Scikit-learn and Pandas.

      - company: UCLA
        position: Undergraduate Researcher, advised by Prof. Guido Montufar
        location: Los Angeles, CA
        start_date: 2025-10
        end_date: present
        highlights:
          - Studying LLM formal theorem proving (Lean, LeanDojo), autoformalization, and RLVR training through the NeurIPS 2025 MATH-AI Workshop with a graduate mentor.
          - Expanded a 78-example dataset to 458 instruction pairs via Evol-Instruct-style augmentation with JSON validation.
          - Fine-tuned Qwen2.5-7B-Instruct with 4-bit QLoRA for algebraic-geometry code generation.
          - Built a 3-stage GEORGE pipeline (Sohoni et al.) in PyTorch and SpuCo to make a CNN robust to spurious background cues in SpuCoMNIST.
          - Clustered baseline classifier outputs to find hidden subgroups without labels, then retrained on balanced batches, raising worst-group accuracy above 98%.

    Projects:
      - name: Brain-Computer Interface Speech Decoding
        summary: EvalAI Brain-to-Text Benchmark 2024
        start_date: 2025-10
        end_date: 2025-10
        highlights:
          - Designed a unidirectional GRU decoder in PyTorch to predict phonemes from intracranial neural recordings.
          - Trained with CTC loss and mixed precision on Google Cloud Platform.
          - Added LayerNorm, post-GRU projection layers, and temporal masking, cutting Phoneme Error Rate from 22.7% to 19.0% at equal per-batch cost.

      - name: Skin Cancer Prediction from 3D Total Body Photographs
        summary: github.com/DalalAryan/CancerPredictionModel
        start_date: 2025-07
        end_date: 2025-07
        highlights:
          - Engineered 30 multi-correlation features from 10K segmented lesion images with OpenCV and scikit-learn.
          - Stacked XGBoost, LightGBM, SVM, and CART base learners under an XGBoost meta-classifier.
          - Reached 88.4% accuracy and 0.81 macro F1 on malignant vs. benign classification.

    Invited Talks:
